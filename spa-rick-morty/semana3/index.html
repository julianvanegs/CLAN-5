<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-App de Notas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 70%; padding: 8px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        button.btn-eliminar { background-color: #dc3545; margin-left: 10px; padding: 4px 8px; font-size: 12px; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { padding: 10px; background: #eee; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mis Notas</h2>
        <p>Escribe una nota y presiona "Agregar" para guardarla.</p>
        
        <input type="text" id="inputNota" placeholder="Escribe una nota aquí...">
        <button id="btnAgregar">Agregar</button>

        <ul id="listaNotas"></ul>
    </div>

    <script src="index.js"></script>
</body>
</html>
